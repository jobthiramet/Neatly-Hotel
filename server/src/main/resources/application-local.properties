# Local profile: in-memory H2 so the API starts without Supabase credentials.
spring.datasource.url=jdbc:h2:mem:neatly;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# Seed the single hotel_info row (same file used in Supabase).
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/002_hotel_info_seed.sql
spring.jpa.defer-datasource-initialization=true
