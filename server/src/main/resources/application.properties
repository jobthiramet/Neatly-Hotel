spring.application.name=hotel
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=8080

# Per-IP rate limit for public GET endpoints (exact paths, comma separated). In-memory, per instance.
app.rate-limit.max-requests=60
app.rate-limit.window=1m
app.rate-limit.paths=/api/rooms,/api/rooms/available

# Hotel-local "today" for search validation, and the longest stay a search accepts.
app.hotel.time-zone=Asia/Bangkok
app.search.max-nights=30

# Frontend origin allowed to call the API.
app.client-origin=${APP_CLIENT_ORIGIN:http://localhost:5173}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Upload limits. Individual services enforce their own smaller limits where needed.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=64MB

# Supabase Storage (server-side only). Empty = storage not configured, uploads return 503.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:hotel-assets}
supabase.storage.profile-bucket=${SUPABASE_PROFILE_STORAGE_BUCKET:profile-pictures}
supabase.storage.room-bucket=${SUPABASE_ROOM_STORAGE_BUCKET:room-images}

# Clerk session-token verification. Use the Frontend API URL shown in Clerk Dashboard.
clerk.issuer=${CLERK_ISSUER:}
clerk.authorized-party=${CLERK_AUTHORIZED_PARTY:}
# Clerk Backend API key, used to mirror profile names to Clerk. Empty = mirroring is skipped.
clerk.secret-key=${CLERK_SECRET_KEY:}

# Stripe (server-side only). Empty = card checkout returns 503; cash bookings still work.
# Prefer a restricted key (rk_test_…) with Checkout Sessions + webhook read.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Brevo (server-side only). Empty key or MAIL_FROM = cancellation emails are skipped; cancel still succeeds.
# MAIL_FROM must be a sender verified in Brevo, for example: Neatly Hotel <you@gmail.com>
brevo.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:}
