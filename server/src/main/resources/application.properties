spring.application.name=hotel
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=8080

# Frontend origin allowed to call the API.
app.client-origin=${APP_CLIENT_ORIGIN:http://localhost:5173}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Upload limits. Individual services enforce their own smaller limits where needed.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Supabase Storage (server-side only). Empty = storage not configured, uploads return 503.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:hotel-assets}
supabase.storage.profile-bucket=${SUPABASE_PROFILE_STORAGE_BUCKET:profile-pictures}

# Clerk session-token verification. Use the Frontend API URL shown in Clerk Dashboard.
clerk.issuer=${CLERK_ISSUER:}
clerk.authorized-party=${CLERK_AUTHORIZED_PARTY:}
