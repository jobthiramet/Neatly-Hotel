spring.application.name=hotel
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=8080

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logo uploads (hotel information). Service validates 2 MB too; request allows form overhead.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Supabase Storage (server-side only). Empty = storage not configured, uploads return 503.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:hotel-assets}
